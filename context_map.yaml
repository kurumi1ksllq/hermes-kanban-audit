# 领域 → 对口专家 · 基准表(context_map)
# 用途:审计「分配合理性」时,判断一张卡"该由谁接手"。
# 状态:草稿 v0.1,待三姐审核
# 日期:2026-10-17
#
# ── 匹配逻辑(重要)──────────────────────────────
# 1) 对一张卡,按 order 从上到下扫所有规则,收集命中的 owner
# 2) 命中恰好 1 个 owner  → 该专家 = 对口
# 3) 命中 ≥2 个不同 owner → 判为「复合任务」,对口 = orchestrator
# 4) 一条都没命中          → 标「未知」,不计入对口率(避免误伤)
#
# ── 为什么按"产出物"而不是"关键词堆"──────────────
# 卡标题常混多个词(如"像素画流水线地基:画布API+校验闸"既有图像又有工程),
# 单靠关键词会错判。规则因此按"这卡最终要交什么"来写;命中多个就交编排,
# 不硬猜。误判会在面板上标出来,可人工在卡上覆盖指定 owner。

version: 1

rules:
  # ── 逆向工程 ──
  - owner: reverse
    order: 10
    match: [逆向, 反编译, 反汇编, 二进制, 脱壳, 加壳, 协议分析, 抓包, dll, so文件, apk, 内嵌前端, 系统提示词提取]
    note: 分析/还原闭源产物

  # ── 翻译汉化 ──
  - owner: translator
    order: 20
    match: [翻译, 汉化, 译文, 本地化, 逐条翻译, 字幕翻译]
    note: 语义化翻译,禁机翻 API

  # ── 音频工程 ──
  - owner: audio-engineer
    order: 30
    match: [混音, 母带, EQ, 均衡, 降噪, 源分离, 提取人声, 干声, 伴奏, 转写, 听写, ASR, 语音转文字, 音频修复, 增益]
    note: 混音/母带/源分离/转写

  # ── 声音 ──
  - owner: voice-artist
    order: 40
    match: [配音, TTS, 朗读, 语音合成, 声音克隆, 歌声合成, 歌声转换, SVC, SVS, 变声, 音色克隆]
    note: 配音/TTS/克隆/歌声

  # ── 图像 ──
  - owner: image-designer
    order: 50
    match: [出图, 封面图, 插画, 贴图, 像素画, 立绘, 表情差分, 图像生成, 图像编辑, 改色, 抠图, 透明底]
    note: ComfyUI 出图/封面/贴图

  # ── 视频 ──
  - owner: videos-designer
    order: 60
    match: [视频, 剪辑, 渲染成片, 分镜, 字幕对齐, 成片, 短片, 讲解视频, 时间轴]
    note: 视频制作/剪辑

  # ── 文档 ──
  - owner: document-handler
    order: 70
    match: [PDF, OCR, 扫描件, 文档提取, 排版, 手册转换, docx, xlsx, PPT, 表格解析]
    note: PDF 拆包/OCR/排版

  # ── 审查 ──
  - owner: reviewer
    order: 80
    match: [审查, 评审, 验收, 质量闸, 反AI味, 独立核对, 复核, 检查是否]
    note: 独立审查,质量闸

  # ── 调研 ──
  - owner: researcher
    order: 90
    match: [调研, 选型, 比价, 比价, 厂商资料, 市场调研, 资料收集, 查证, 榜单, 评估对比, 摸清行情]
    note: 调研/选型/比价

  # ── 编码 ──
  - owner: coder
    order: 100
    match: [写代码, 脚本, 实现, 修bug, 修缺陷, 重构, 测试, 落地, 工程骨架, CLI, API 实现, 部署脚本]
    note: 编码执行(经 pi)

  # ── 编排 ──
  - owner: orchestrator
    order: 110
    match: [拆解, 编排, 派活, 汇总, 多步串起来, 统筹]
    note: 编排者:拆活/派活/盯进度/汇总

# ── 已知边界情况(需人工确认)──────────────────────
# 这些卡按上面的规则会判「复合→orchestrator」,但实际归单个专家更准。
# 处理：面板上给「人工覆盖 owner」入口,覆盖值优先于自动判定。
edge_cases:
  - "像素画流水线地基:画布 API + 校验闸"   # 含"像素画"+"API"→判复合,实际应 coder
  - "出图:封面「X」"                        # 含"出图"→image-designer,正确
  - "转写:视频音频 → 纯文本"                # 含"转写"→audio-engineer,正确

# ── 常见复合任务(应走 orchestrator)──────────────
# "像素画出图 + 工程流水线"、"字幕汉化(视频+翻译+对齐)"、
# "逆向 + 复刻实现"、"调研 + 出图 + 成片"
